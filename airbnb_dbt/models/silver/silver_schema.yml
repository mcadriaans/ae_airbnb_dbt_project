version: 2

models:
  - name: silver_hosts
    description: >
      Cleaned, transformed, and enriched host records derived from the bronze layer. 
      This model standardizes raw host data and calculates key business metrics such as total listings and average response time. 
      It is materialized incrementally to optimize processing performance.
    columns:
      - name: host_id
        description: Unique identifier for a host.
        tests:
          - unique
          - not_null
      - name: host_name
        description: Name of the host.
        tests:
          - not_null
      - name: host_since
        description: Date when the host joined the platform.
        tests:
          - not_null
      - name: host_location
        description: Location of the host.
        tests:
          - not_null
      - name: is_superhost
        description: Indicates whether the host is a superhost.
        tests:
          - accepted_values:
              values: [true, false]
          - not_null
      - name: response_rate
        description: Percentage of booking inquiries the host has responded to.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true 
      - name: avg_host_rating
        description: Average rating of the host.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 5
              inclusive: true 
      - name: created_at
        description: Timestamp when the record was first created.
        tests:
          - not_null
      - name: updated_at
        description: Timestamp when the record was last updated.
        tests:
          - not_null
      - name: loaded_at
        description: Timestamp when the record was loaded into the silver layer.
        tests:
          - not_null
  - name: silver_bookings
    description: >
      Cleaned, transformed, and enriched booking records derived from the bronze layer. 
      This model standardizes raw booking data and calculates key business metrics such as lead time, 
      stay duration, and total expected revenue. 
      It is materialized incrementally to optimize processing performance.
    columns:
      - name: booking_id
        description: Unique identifier for a booking.
        tests:
          - unique
          - not_null
      - name: listing_id
        description: Identifier for the listing associated with the booking.
        tests:
          - not_null
      - name: booking_status
        description: Status of the booking, indicating whether it is confirmed or cancelled.
        tests:
          - accepted_values:
              values: ['confirmed', 'cancelled']
      - name: booking_date
        description: Date when the booking was made.
        tests:
          - not_null
      - name: stay_start_date
        description: Start date of the stay.
        tests:
          - not_null
      - name: lead_time_days
        description: Number of days between booking date and stay start date.
        tests:
          - not_null
      - name: nights_booked
        description: Number of nights booked for the stay.
        tests:
          - not_null
      - name: stay_end_date
        description: Calculated end date of the stay based on nights booked.
        tests:
          - not_null
      - name: booking_amount
        description: Amount paid for the booking.
        tests:
          - not_null
      - name: cleaning_fee
        description: Cleaning fee associated with the booking.
        tests:
          - not_null
      - name: service_fee
        description: Service fee associated with the booking.
        tests:
          - not_null
      - name: cancellation_fee
        description: Fee charged for cancellations, if applicable.
        tests:
          - not_null
      - name: expected_revenue
        description: >
          Expected revenue from the booking, calculated as the sum of booking amount,
          cleaning fee, and service fee.
        tests:
          - not_null
      - name: created_at
        description: Timestamp when the record was first created.
        tests:
          - not_null
      - name: updated_at
        description: Timestamp when the record was last updated.
        tests:
          - not_null
      - name: loaded_at
        description: Timestamp when the record was loaded into the silver layer.
        tests:
          - not_null