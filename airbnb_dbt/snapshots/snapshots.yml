# snapshots/snapshots.yml

version: 2

snapshots:
  - name: bookings_snapshot
    description: >
        SCD2 SNAPSHOT: Track booking changes over time.
        
        KEY TRANSITION:
        - Bronze (source): booking_id is PK (one row per booking)
        - Snapshot (this): dbt_scd_id is PK (one row per booking VERSION)
      
        When dbt snapshot runs with unique_key='booking_id':
        1. Detects changes to booking_status (or any tracked column)
        2. Auto-generates dbt_scd_id (surrogate PK for each version)
        3. booking_id becomes a natural key (no longer unique here)
        4. One booking_id can have multiple dbt_scd_ids (different versions)
      
        GRAIN: One row = one version of one booking

        EXAMPLE : Capture changes to booking_status (confirmed → cancelled) and when they happen.
        BUSINESS CASE:
        -   Bookings are typically created in 'confirmed' state
        -   Later, some are cancelled
        - We need to preserve the history: WHEN did the cancellation happen?
          (This enables cohort analysis: "Of bookings made on Jan 1, 
           what % were still confirmed on Jan 8?")

        TECHNICAL APPROACH:
        - snapshot uses strategy='timestamp' with updated_at field
        - When a booking_status changes, snapshot automatically:
        1. Closes the old record: dbt_valid_to = when change was detected
        2. Opens a new record: dbt_valid_from = when change was detected
        - Silver enriches this snapshot data with calculations

        HOW ANALYSTS USE IT:
        - SELECT * WHERE booking_id = 'X' AND  dbt_valid_to IS NULL
        → Get current state of booking X
    
        - SELECT * WHERE booking_id = 'X' ORDER BY dbt_valid_from
        → See full history of changes to booking X
    columns:
      - name: booking_id
        description: "PK: Unique identifier for each booking."
        tests:
          - not_null
      - name: booking_date
        description: "Date when the booking was made."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              name: booking_date_not_in_future
              expression: "booking_date >=  '{{ var('airbnb_launch_date') }}'   AND booking_date <= current_date() + INTERVAL '2 year' "
      - name: booking_status
        description: "Status of the booking (e.g., confirmed, cancelled)."
        tests:
          - not_null
          - accepted_values:
              values: ['confirmed', 'cancelled']
      - name: listing_id
        description: "FK: Identifier for the listing being booked."
        tests:
          - not_null
          - relationships:
              to: ref('stg_airbnb__listings')
              field: listing_id
      - name: stay_start_date
        description: "Date when the guest is scheduled to check in."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
                name: stay_start_date_not_in_past
                expression: "stay_start_date >= booking_date"   # Bookings can't start in the past
      - name: nights_booked
        description: "Number of nights the guest is staying."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
      - name: booking_amount
        description: "Total amount paid for the booking."
        
      - name: cleaning_fee
        description: "Fee for cleaning the property."
      - name: service_fee
        description: "Fee for using the platform's services."
      - name: cancellation_fee
        description: "Fee for cancelling the booking."
      - name: created_at
        description: "Timestamp of when the booking was created."
      - name: updated_at
        description: "Timestamp of the last update to the booking record."
      - name: dbt_scd_id
        description: "Unique identifier for each version of a booking record (auto-generated by dbt)."
        tests:
          - unique
          - not_null
      - name: dbt_valid_from
        description: "Timestamp of when this version of the record became valid (auto-managed by dbt)."
        tests:
          - not_null
      - name: dbt_valid_to
        description: "Timestamp of when this version of the record became invalid (auto-managed by dbt)."
