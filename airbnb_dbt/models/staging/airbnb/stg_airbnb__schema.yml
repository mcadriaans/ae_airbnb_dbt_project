#-- stg_airbnb__schema.yml:
## Business Contract : Tests if the data makes sense (Ranges, Accepted Values, Logical Comparisons

version: 2

models:
  - name: stg_airbnb__bookings
    description: >
      STAGING: Standardized booking data.
      Logic: Lowercase IDs/Status, Cast Types, and COALESCE null metrics
      This layer enforces 'Business Sanity' before data hits the Silver history tracking.
    config:
      materialized: view
    
    columns:
      # -- KEYS
      - name: booking_id
        description: "PK: Unique booking identifier (UUID format)."
        tests:
          - not_null:
              config:
                severity: error
      - name: listing_id
        description: "FK to staging listings"
        tests:
          - relationships:
              to: ref('stg_airbnb__listings')
              field: listing_id
              description: "Ensures referential integrity between staging models."
              config:
                severity: warn

      # -- STATUS & CATEGORIES
      - name: booking_status
        description: "Booking state (confirmed or cancelled)."
        tests:
          - accepted_values:
              values: ['confirmed', 'cancelled']

      # -- DATA SANITY
      - name: booking_date
        description: "Date when booking was made."
        tests:
          - dbt_utils.expression_is_true:
              name: booking_date_not_in_future
              expression: "booking_date >=  '{{ var('airbnb_launch_date') }}' AND booking_date <= CURRENT_DATE()"  
      - name: stay_start_date
        description: "Guest check-in date."
        tests:
          - dbt_utils.expression_is_true:
              name: stay_start_date_not_in_past
              expression: "stay_start_date >= booking_date"
      
      # -- METRIC RANGES
      - name: nights_booked
        description: "Number of nights booked."
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 730  
              description: "Sanity check: Stays must be between 1 night and 2 years."
      - name: booking_amount
        description:  "Base room price."
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 100000
      - name: cleaning_fee
        description: "Cleaning fee."
        tests:
          - not_negative:
              description: "Ensures fee is 0 or higher (Coalesced in SQL)."
      - name: service_fee
        description: "Service/platform fee."
        tests:
          - not_negative:
              description: "Ensures fee is 0 or higher (Coalesced in SQL)."
      - name: cancellation_fee
        description: "Cancellation fee (if applicable)."
        tests:
          - not_negative
          - dbt_utils.expression_is_true:
              name: cancellation_fee_sanity
              expression: "cancellation_fee <= booking_amount"

      # -- AUDIT METADATA
      - name: created_at
        description: "When record was created in source system."
        tests:
          - not_in_future:
              description: "Custom test: Record cannot be created in the future."
      - name: updated_at
        description: "When record was last updated in source system."
        tests:
          - not_in_future
          - dbt_utils.expression_is_true:
              name: update_after_create
              expression: "updated_at >= created_at"
              description: "Audit Logic: Last update cannot happen before creation."
          