version: 2

sources:
  - name: airbnb
    description: "Raw Airbnb data loaded into the warehouse before transformation."
    database: AIRBNB
    schema: DEV_BRONZE

    tables:
      - name: bronze_bookings
        identifier: BRONZE_BOOKINGS
        description: "Raw booking-level data including dates, fees, and booking status."
        columns:
          - name: booking_id
            description: "Unique identifier for each booking."
            tests:
              - not_null
              - unique

      - name: bronze_listings
        identifier: BRONZE_LISTINGS
        description: "Raw listing-level data including property details and pricing."
        columns:
          - name: listing_id
            description: "Unique identifier for each listing."
            tests:
              - not_null
              - unique

      - name: bronze_hosts
        identifier: BRONZE_HOSTS
        description: "Raw host-level data including host names and account metadata."
        columns:
          - name: host_id
            description: "Unique identifier for each host."
            tests:
              - not_null
              - unique

