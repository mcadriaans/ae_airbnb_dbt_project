# snapshots/bookings_snapshots.yml


version: 2

snapshots:
  - name: bookings_snapshot
    description: >
        SCD2 AUDIT LAYER: Tracking historical changes to bookings.
        Grain: One row per version of a booking.
    
        
        KEY TRANSITION:
        - Bronze (source): booking_id is PK (one row per booking)
        - Snapshot (this): dbt_scd_id is PK (one row per booking VERSION)

    

        TECHNICAL APPROACH:
        - snapshot uses strategy='timestamp' with 'updated_at' field
        - When a booking_status changes, snapshot automatically:
        1. Closes the old record: dbt_valid_to = when change was detected
        2. Opens a new record: dbt_valid_from = when change was detected
        - Silver enriches this snapshot data with calculations

        HOW ANALYSTS USE IT:
        - SELECT * WHERE booking_id = 'X' AND  dbt_valid_to IS NULL
        → Get current state of booking X
    
        - SELECT * WHERE booking_id = 'X' ORDER BY dbt_valid_from
        → See full history of changes to booking X
    tests:
      - dbt_utils.expression_is_true:
          name: snapshot_valid_to_after_from
          description: "Technical Check: Records cannot end before they begin."
          expression: "dbt_valid_to >= dbt_valid_from OR dbt_valid_to IS NULL"
    
      - dbt_utils.expression_is_true:
          name: snapshot_unique_current_record
          description: > 
           Technical Check: Each booking_id must have exactly one 'active' version.
           This catches 'flapping' or overlapping SCD2 records.
          expression: "sum(case when dbt_valid_to is null then 1 else 0 end) over (partition by booking_id) = 1"
          config:
            severity: error
       

    columns:
      - name: booking_id
        description: "Natural Key: Original booking identifier from source system (UUID)."
        tests:
          - not_null
      - name: source_updated_at
        description: "The source timestamp used by the snapshot strategy to detect changes."

      
      # Audit SCD2 TECHNICAL COLUMNS
      - name: dbt_scd_id
        description: "PK: The primary key of the snapshot layer. Generated by dbt."
        tests:
          - unique
          - not_null

      - name: dbt_valid_from
        description: "Audit: When this specific version of the booking was first detected."
        tests:
          - not_null
          - not_in_future

      - name: dbt_valid_to
        description: "Audit: When this version was closed. NULL represents the 'Current' state."