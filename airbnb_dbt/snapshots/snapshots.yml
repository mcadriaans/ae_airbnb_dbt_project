## snapshots/snapshots.yml
# Test definitions for the SCD2 snaphot of the bookings table.
# Scope: SCD2 mechanics only (timing of dbt_valid_from and dbt_valid_to, uniqueness of current record, dbt audit columns, etc.)
# Business Logic enrichment is handled in the Silver layer, not here.

version: 2

snapshots:
  - name: bookings_snapshot
    description: >
        SCD2 AUDIT LAYER: tracks historical changes to bookings over time.
        Grain: One row per version of a booking (not one row per booking).
    
        
        KEY TRANSITION:
        - Bronze(source) / Staging : booking_id is PK (one row per booking)
        - Snapshot (this layer): dbt_scd_id is PK (one row per booking VERSION)

  
        TECHNICAL APPROACH:
        - Uses strategy='timestamp' against the source_updated_at column to detect changes to the booking record.
        - When a tracked column changes, dbt automatically:
        1. Closes the old record: dbt_valid_to = when the change was detected.
        2. Opens a new record: dbt_valid_from = when the change was detected, dbt_valid_to = NULL (current state).
        - Silver layer can then use this snapshot and add business logic.

        HOW ANALYSTS USE IT:
        - SELECT all WHERE booking_id = 'X' AND  dbt_valid_to IS NULL
          →  current state of booking X
    
        - SELECT all WHERE booking_id = 'X' ORDER BY dbt_valid_from
          → full history of booking X, including all changes over time.
    tests:
      - dbt_utils.expression_is_true:
          name: snapshot_valid_to_after_from
          description: "Technical Check: Records cannot end before they begin."
          arguments:
            expression: "dbt_valid_to >= dbt_valid_from OR dbt_valid_to IS NULL"
  
    columns:
      - name: booking_id
        description: "Natural Key: Original booking identifier from source system (UUID)."
        tests:
          - not_null:
              config:
                severity: error
          - unique:
              name: snapshot_unique_current_record
              description: >
                Technical Check: Each booking_id can only have exactly one active version at a time.
                This test checks that there are no duplicates with the same booking_id and dbt_valid_to IS NULL.
              config:
                where: "dbt_valid_to IS NULL"
      - name: source_updated_at
        description: >
          Technical Column: The timestamp of the last update to this booking in the source system.
          This column is used by dbt to detect changes to the booking record and trigger a new version in the snapshot.
          Already tested for integrity at the staging layer (not_in_future, not_null, etc.), so no need to test here, since 
          snapshot does not modify this column, it just uses it to detect changes.

      # Audit SCD2 TECHNICAL COLUMNS
      - name: dbt_scd_id
        description: "PK: The primary key of the snapshot layer. Generated by dbt; one unique row per booking version."
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: dbt_valid_from
        description: "Audit: When this specific version of the booking was first detected."
        tests:
          - not_null:
              config:
                severity: error
          - not_in_future:
              config:
                severity: error

      - name: dbt_valid_to
        description: >
          Audit: when this version was closed (i.e. when a new version was detected). NULL indicates this is the current (still-open)
          version of the booking. When populated, this timestamp indicates a change that has already happened,
          so it should never be a future date. However, a violation here affect point-in-time historical queries for this one row,
          not the table's overall integrity, so this test is a warning, not an error.
        tests:
          - not_in_future:
              config:
                severity: warn

