name: 'airbnb_dbt'
version: '1.0.0'
profile: 'airbnb_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  airbnb_launch_date: '2008-08-01'

seeds:
  airbnb_dbt:
    +schema: seeds
    

models:
  airbnb_dbt:
    silver:
      +schema: silver
      +materialized: view
    gold:
      core:
        +schema: core
        +materialized: table
      marts:
        +schema: marts
        +materialized: view
