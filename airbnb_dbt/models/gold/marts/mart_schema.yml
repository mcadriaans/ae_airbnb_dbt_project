version: 2

models:
  - name: mart_cancellation_analysis
    description: |
      Business-focused mart analyzing revenue loss from cancellations.
      Grain: One row per unique combination of (country, city, property_type, price_tier, lead_time_group).
      
      Pre-aggregated for Tableau consumption. Shows:
      - Cancellation rates by segment
      - Revenue loss vs. recovery potential
      - Lead-time impact on cancellation risk
      
      Built from: fact_bookings
      
    columns:
      - name: country
        description: "Country dimension"
      
      - name: city
        description: "City dimension"
      
      - name: property_type
        description: "Property type dimension"
      
      - name: price_tier
        description: "Price tier bucketed: Budget, Mid-Range, Luxury"
      
      - name: lead_time_group
        description: "Lead time bucketed: 0-6 days, 7-30 days, 31-90 days, 90+ days"
      
      - name: total_bookings
        description: "Count of bookings in this segment"
      
      - name: cancelled_bookings
        description: "Count of cancelled bookings"
      
      - name: cancellation_rate
        description: "Cancellation rate (0.0-1.0)"
      
      - name: avg_lead_time_cancelled
        description: "Average lead time for cancelled bookings"
      
      - name: avg_lead_time_confirmed
        description: "Average lead time for confirmed bookings"
      
      - name: potential_revenue
        description: "Sum of booking_revenue (what we would earn if no cancellations)"
      
      - name: actual_revenue
        description: "Sum of actual_revenue (what we actually earned)"
      
      - name: gross_revenue_loss
        description: "Sum of gross_revenue_loss (total potential lost)"
      
      - name: cancellations_revenue
        description: "Sum of cancellation_fee (recovery from cancellations)"
      
      - name: net_revenue_loss
        description: "Sum of net_revenue_loss (actual loss after recovery)"

  - name: mart_host_performance
    description: |
      Host-focused mart for performance analysis and ranking.
      Grain: One row per unique host (host_id).
      
      Shows:
      - Host KPIs (revenue, bookings, ratings)
      - Portfolio composition (number of listings)
      - Cancellation risk per host
      
      Built from: dim_hosts + fact_bookings + dim_listings
      
    columns:
      - name: host_id
        description: "PK: Host identifier"
        tests:
          - unique
          - not_null
      
      - name: host_name
        description: "Host name"
      
      - name: is_superhost
        description: "Boolean: Airbnb Superhost status"
      
      - name: host_rating_category
        description: "Rating category bucketed"
      
      - name: avg_host_rating
        description: "Average guest rating"
      
      - name: response_rate
        description: "Response rate (0-1)"
      
      - name: host_tenure_years
        description: "Years on platform"
      
      - name: total_listings
        description: "Count of listings owned by host"
      
      - name: total_bookings
        description: "Count of bookings across all listings"
      
      - name: avg_nights_per_booking
        description: "Average stay length"
      
      - name: total_revenue
        description: "Sum of booking_revenue (potential)"
      
      - name: actual_revenue
        description: "Sum of actual_revenue (collected)"
      
      - name: revenue_per_listing
        description: "actual_revenue / total_listings (efficiency metric)"
      
      - name: cancellation_rate
        description: "Host cancellation rate (0-1)"

  - name: mart_listing_performance
    description: |
      Property-focused mart for occupancy and pricing analysis.
      Grain: One row per unique listing (listing_id).
      
      Shows:
      - Occupancy rate (bookings per 365 days)
      - Revenue per booking
      - Price per night
      - Cancellation risk per property
      
      Built from: dim_listings + dim_hosts + fact_bookings
      
    columns:
      - name: listing_id
        description: "PK: Listing identifier"
        tests:
          - unique
          - not_null
      
      - name: property_type
        description: "Type: Condo, Loft, Apartment, etc."
      
      - name: city
        description: "City"
      
      - name: country
        description: "Country"
      
      - name: price_tier
        description: "Price tier bucketed"
      
      - name: listing_size_category
        description: "Size category bucketed"
      
      - name: host_name
        description: "Owner host name"
      
      - name: total_bookings
        description: "Count of bookings for this property"
      
      - name: occupancy_rate_pct
        description: "Annualized occupancy rate as percentage (bookings / 365 * 100)"
      
      - name: avg_price_per_night
        description: "Average nightly rate"
      
      - name: total_revenue
        description: "Sum of booking_revenue"
      
      - name: avg_revenue_per_booking
        description: "Average revenue per booking"
      
      - name: cancellation_rate
        description: "Cancellation rate for this property (0-1)"

