version: 2

models:
  - name: fact_bookings
    description: >
      Fact table containing one row per booking. Includes revenue metrics,
      cancellation logic, host and listing attributes, and booking behavior KPIs.
    columns:
      - name: booking_id
        description: "Primary key for the booking."
      - name: listing_id
        description: "Foreign key to the dim_listings table."
      - name: host_id
        description: "Foreign key to the dim_hosts table."
      - name: booking_date
        description: "Date when the booking was made."
      - name: booking_status
        description: "Status of the booking (e.g. confirmed, cancelled)."
      - name: stay_start_date
        description: "Start date of the stay."
      - name: stay_end_date
        description: "End date of the stay."
      - name: lead_time_days
        description: "Number of days between booking date and stay start date."
      - name: country
        description: "Country where the property is located."
      - name: city
        description: "City where the property is located."
      - name: property_type
        description: "Type of property (loft, house, condo, boutique hotel, apartment)."
      - name: room_type
        description: "Type of room booked (e.g. entire home, private room)."
      - name: is_superhost
        description: "Indicates whether the host is a superhost."
      - name: nights_booked
        description: "Number of nights booked for the stay."
      - name: booking_amount
        description: "Total amount paid for the booking."
      - name: cleaning_fee
        description: "Cleaning fee charged for the booking."
      - name: service_fee
        description: "Service fee charged for the booking."
      - name: total_revenue
        description: "Total revenue from the booking (booking_amount + cleaning_fee + service_fee)."
      - name: cancellation_fee 
        description: "Fee charged based on lead time and cancellation rules."
      - name: actual_revenue
        description: "Revenue from the booking after accounting for cancellations (total_revenue - cancellation_fee)."
      - name: revenue_loss
        description: "Revenue lost due to cancellations (total_revenue - cancellation_fee)."
      - name: is_cancelled
        description: "Boolean indicating whether the booking was cancelled."
      - name: is_confirmed
        description: "Boolean indicating whether the booking was confirmed (not cancelled)."

  - name: dim_listings
    description: "Dimension table containing listing attributes used for slicing fact tables."
    columns:
      - name: listing_id
        description: "Unique identifier for the listing."
      - name: city
        description: "City where the listing is located."
      - name: property_type
        description: "Type of property (entire home, private room, etc.)."

  - name: dim_hosts
    description: "Dimension table containing host attributes and performance indicators."
    columns:
      - name: host_id
        description: "Unique identifier for the host."
      - name: host_name
        description: "Name of the host."
      - name: host_since
        description: "Date when the host joined Airbnb."
      - name: is_superhost
        description: "Boolean indicating whether the host is a superhost."
      - name: response_rate
        description: "Host's response rate to booking inquiries."
      - name: avg_host_rating
        description: "Average rating across all listings owned by the host."
      - name: total_listings
        description: "Total number of listings owned by the host."
      - name: host_portfolio_type
        description: "Categorization of host based on number of listings (e.g. Single Listing, Multi-listing)."
      - name: host_rating_category
        description: "Categorization of host based on average rating (e.g. Premium, Moderate, Low)."
      - name: host_profile_last_updated
        description: "Timestamp of the last update to the host's profile."


  - name: cancellation_analysis
    description: >
      Aggregate model providing insights into booking cancellations across country,
      city, and property_type. Includes cancellation rates, lead time behaviour, and 
      cancellation fee revenue.
    columns:
      - name: country
        description: "Country where the property is located."
        tests:
          - not_null
      - name: city
        description: "City of the property."
        test:
            - not_null
      - name: property_type
        description: >
         High-level property category (e.g. apartment, house). Helps break down
         booking patterns by type of inventory.
        tests:
          - not_null
      - name: total_bookings
        description: "Total number of bookings for the given group"
        tests:
          - not_null
      - name: cancelled_bookings
        description: "Number of bookings that were cancelled"
      - name: avg_lead_time_cancelled
        description: "Average lead time (in days) for cancelled bookings"
      - name: avg_lead_time_completed
        description: "Average lead time (in days) for non-cancelled bookings"
        test:
            - not_null
      - name: cancellation_fee_revenue
        description: "Total revenue collected from cancellation fees"
      - name: cancellation_rate
        description: "Proportion of bookings that were cancelled (0–1)"       
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1