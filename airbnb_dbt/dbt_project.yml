# dbt_project.yml

name: 'airbnb_dbt'
version: '1.0.0'
profile: 'airbnb_dbt'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
seed-paths: ["seeds"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  airbnb_launch_date: '2008-08-01'

seeds:
  airbnb_dbt:
    +schema: seeds

snapshots:
  airbnb_dbt:
    +schema: snapshots
    +strategy: timestamp
    +updated_at: updated_at

    
models:
  airbnb_dbt:
    staging:
      +schema: staging
      +materialized: view
    silver:
      +schema: silver
      +materialized: incremental
      silver_bookings:
        +meta:
          scd_type: 2  
          grain: "booking_id + dbt_scd_id (one row per booking version)"
          description: "SCD2 Silver model capturing booking history with surrogate keys for each version."
      silver_hosts:
        +meta:
          scd_type: 1
          grain: "host_id (one row per host)"
          description: "Silver model for hosts with one row per unique host_id."
      silver_listings:
        +meta:
          scd_type: 1
          grain: "listing_id (one row per listing)"
          description: "Silver model for listings with one row per unique listing_id."
    gold:
      core:
        +schema: core
        +materialized: table
      marts:
        +schema: marts
        +materialized: view
