version: 2

models:
  - name: bronze_bookings
    description: >
      Incremental bronze ingestion table for raw bookings data. Applies light
      standardization, type casting, and ingestion metadata while preserving
      source grain and capturing new or updated records.
    config:
      tags: ['bronze']
    columns:
      - name: booking_id
        description: "Unique identifier for each booking."
        tests:
          - not_null
          - unique

  - name: bronze_hosts
    description: >
      Incremental bronze ingestion table for raw host data. Performs basic
      formatting, timestamp casting, and adds ingestion metadata while
      preserving the original host-level grain.
    config:
      tags: ['bronze']
    columns:
      - name: host_id
        description: "Unique identifier for each host."
        tests:
          - not_null
          - unique

  - name: bronze_listings
    description: >
      Incremental bronze ingestion table for raw listing data. Normalizes text
      fields, casts timestamps, and preserves the original listing grain while
      capturing new or updated records.
    config:
      tags: ['bronze']
    columns:
      - name: listing_id
        description: "Unique identifier for each listing."
        tests:
          - not_null
          - unique

