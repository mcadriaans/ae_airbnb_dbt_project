version: 2

models:

  # ---------------------------------------------------------
  # SILVER: CLEANED
  # ---------------------------------------------------------
  - name: silver_bookings_cleaned
    description: "Cleaned booking data with standardized types, normalized status, and corrected date formats."
    columns:
      - name: booking_id
        description: "Unique identifier for each booking."
        tests:
          - not_null
          - unique

      - name: listing_id
        description: "Identifier for the listing associated with the booking."
        tests:
          - not_null

      - name: booking_date
        description: "Check-in date converted to DATE type."
        tests:
          - not_null

      - name: nights_booked
        description: "Number of nights included in the booking."
        tests:
          - not_null

      - name: booking_amount
        description: "Total booking amount before fees."
        tests:
          - not_null

      - name: cleaning_fee
        description: "Cleaning fee charged for the booking."
        tests:
          - not_null

      - name: service_fee
        description: "Service fee charged for the booking."
        tests:
          - not_null

      - name: booking_status
        description: "Normalized booking status."
        tests:
          - accepted_values:
              values: ['cancelled', 'completed', 'pending', 'confirmed']

  # ---------------------------------------------------------
  # SILVER: DEDUPED
  # ---------------------------------------------------------
  - name: silver_bookings_deduped
    description: "Deduplicated booking data using booking_id as the unique key."
    columns:
      - name: booking_id
        description: "Unique identifier for each booking."
        tests:
          - not_null
          - unique

  # ---------------------------------------------------------
  # SILVER: ENRICHED
  # ---------------------------------------------------------
  - name: silver_bookings_enriched
    description: "Enriched booking data with calculated totals, stay end date, and status flags."
    columns:
      - name: total_fees
        description: "Sum of cleaning_fee and service_fee."
        tests:
          - not_null

      - name: total_amount
        description: "Total booking cost including fees."
        tests:
          - not_null

      - name: stay_end_date
        description: "Calculated checkout date based on booking_date + nights_booked."
        tests:
          - not_null

      - name: is_cancelled
        description: "Boolean flag indicating whether the booking was cancelled."
        tests:
          - accepted_values:
              values: [true, false]

      - name: is_completed
        description: "Boolean flag indicating whether the booking was completed."
        tests:
          - accepted_values:
              values: [true, false]
