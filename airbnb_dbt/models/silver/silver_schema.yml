## models/silver/silver_schema.yml : This schema file defines the structure, descriptions, and tests for the silver layer models in the Airbnb data warehouse. 
## It includes detailed documentation for each model and column, as well as comprehensive tests to ensure data quality and integrity as the raw bronze data
## is transformed into a more refined format for analysis and reporting.

version: 2

models:
  - name: silver_bookings
    description: >
      SILVER: Enriched booking facts with SCD2 history
      INPUT: bookings_snapshot (SCD2 tracking booking status changes)
      OUTPUT: Facts enriched with business logic + all history preserved

      WHAT IT DOES:
      1. Lead time: days between booking_date and stay_start_date
        → Insight: How far in advance are people booking?

      2. Stay end date: stay_start_date + nights_booked
        → Required for stay duration analysis

      3. Booking revenue: booking_amount + cleaning_fee + service_fee
        → Total expected revenue from each booking

      4. History: All SCD2 fields preserved
        → Enables "when did booking status change?" analysis

      INCREMENTAL STRATEGY:
      - Merge strategy: processes new versions, doesn't duplicate
      - Only processes new snapshot versions: WHERE dbt_valid_from >= max(dbt_valid_from)
      - Preserves all history: old versions remain with dbt_valid_to set

      GRAIN: One row per booking_id version (SCD2)
      - If booking_status changes: new version created
      - Latest version has dbt_valid_to = NULL, is_current_record = 1

      FOR ANALYSTS:
      - Get latest state: WHERE is_current_record = 1
      - Get full history: ORDER BY booking_id, dbt_valid_from
      - Find state on specific date: WHERE booking_date <= 'YYYY-MM-DD' AND (dbt_valid_to IS NULL OR dbt_valid_to > 'YYYY-MM-DD')

    tests:
        #  CROSS-COLUMN LOGIC: These ensure your SQL calculations make sense and that the relationships between fields are consistent with business rules.
        - dbt_utils.expression_is_true:
              name: booking_date_within_valid_range
              expression: "booking_date >= '{{ var('airbnb_launch_date') }}' AND booking_date <= CURRENT_DATE()"  
        - dbt_utils.expression_is_true:
              name: stay_end_date_after_start_date
              expression: "stay_end_date >= stay_start_date"  
        - dbt_utils.expression_is_true:
              name: cancellation_fee_within_revenue_limit
              expression: "cancellation_fee <= booking_revenue" 
        - dbt_utils.expression_is_true:
              name: is_current_record_consistency
              expression: "is_current_record = CASE WHEN dbt_valid_to IS NULL THEN 1 ELSE 0 END"
    columns:
      # Keys  
      - name: booking_id
        description: "NK: Natural key identifying a booking across all versions (UUID)"
        tests:
          - not_null
          # NOT unique because of SCD2: multiple versions of same booking_id can exist
      - name: listing_id
        description: "FK: Identifier for the listing associated with the booking."
        tests:
          - not_null
          - relationships:
              to: ref('silver_listings')
              field: listing_id
              config:
                severity: warn # sometimes a booking arrives before the Listing is synced,It notifies you, but doesn't stop the run

       # Dimensions
      - name: booking_status
        description: "Status of the booking (e.g., confirmed, cancelled)."
        tests:
          - not_null
          - accepted_values:
              values: ['confirmed', 'cancelled']

      # Dates
      - name: booking_date
        description: "Date when the booking was made."
        tests:
          - not_null
      - name: stay_start_date
        description: "Start date of the stay."
        tests:
          - not_null
      - name: stay_end_date 
        description: "End date of the stay."
        tests:
          - not_null

      # Durations
      - name: lead_time_days
        description: "Number of days between the booking date and the stay start date."
        tests:
          - not_null
          - not_negative
          - dbt_utils.accepted_range:
              name: lead_time_days_non_negative
              min_value: 0
              max_value: 730
              inclusive: true
      - name: nights_booked
        description: "Number of nights booked for the stay."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              name: nights_booked_positive
              min_value: 1
              inclusive: true
      # Amounts
      - name: booking_amount
        description: "Amount paid for the booking."
        tests:
          - not_null
          - not_negative
      - name: cleaning_fee
        description: "Cleaning fee associated with the booking."
        tests:
          - not_null
          - not_negative
      - name: service_fee
        description: "Service fee associated with the booking."
        tests:
          - not_null
          - not_negative
      - name: cancellation_fee
        description: "Cancellation fee associated with the booking, if applicable."
        tests:
          - not_null
          - not_negative
      - name: booking_revenue
        description: >
          Total expected revenue from the booking.
          Calculation : booking_amount + cleaning_fee + service_fee
        tests:
          - not_null
          - not_negative  

        # SCD2  
      - name: dbt_scd_id
        description: "SK: Surrogate key uniquely identifying each booking version (auto-generated by dbt)."
        tests:
          - unique
          - not_null
      - name: dbt_valid_from
        description: "Timestamp indicating when the record became valid."
        tests:
          - not_null
      - name: dbt_valid_to
        description: "Timestamp indicating when the record ceased to be valid."
      - name: is_current_record
        description: "Flag indicating whether the record is the current version."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              
      # Metadata
      - name: created_at
        description: "Timestamp when the record was first created."
        tests:
          - not_null
          - not_in_future
      - name: updated_at
        description: "Timestamp when the record was last updated."
        tests:
          - not_null
          - not_in_future
      - name: dbt_updated_at  
        description: "Timestamp of the last update to the record, managed by dbt."
        tests:
          - not_null
          - not_in_future
      - name: loaded_at 
        description: "Timestamp when the record was loaded into the silver layer."
        tests:
          - not_null
          - not_in_future 


  - name: silver_hosts
    description: >
     - Standardized and enriched host profiles (SCD1)
     - Input : stg_airbnb_hosts  Output: Single source of truth for host attributes and performance metrics

     WHAT IT DOES:
     1. Normalization: Standardizes host names and locations(logic handled in staging).
     2. Host Tenure: Computes 'host_tenure_years' based on 'hosts_since'.
        -> Insight: How long has the host been part of the platform?
     3. Rating Categorization: Bins 'avg_host_rating' into business friendly labels (Excellent, Good, etc.).
        -> Insight : Quick filtering for high-performing hosts.
     4. Boolean Standardizing: Ensures 'is_superhost' is a clean boolean (true/false).

     INCREMENTAL STRATEGY.
     - Strategy: delete+insert (SCD Type 1)
     - Logic: Overwrites existing host records with latest state.
     - Lookback: Includes a 7-day lookback on 'updated_at' to handle late-arriving source updates.

     GRAIN: One row per host_id (UNIQUE)
     - This model does NOT track history (SCD1). For historical host state, use snapshots.

     FOR ANALYSTS:
     - Latest Profile: Simply query the table ; every row is the most recent known state.
     - Performance Analysis: Use 'host_rating_category' and 'is_superhost' to segment host behaviour.

    tests:
    # CROSS-COLUMN LOGIC
    - dbt_utils.expression_is_true:
        name: host_tenure_reasonable
        expression: "host_tenure_years >= 0 AND host_tenure_years <= 30"
    - dbt_utils.expression_is_true: 
        name: rating_category_consistency
        expression: >
          CASE
            WHEN avg_host_rating >= 4.5 THEN host_rating_category = 'Excellent' 
            WHEN avg_host_rating >= 4.0 THEN host_rating_category = 'Good' 
            WHEN avg_host_rating >= 3.0 THEN host_rating_category = 'Average' 
            WHEN avg_host_rating < 3.0 THEN host_rating_category = 'Below Average' 
            WHEN avg_host_rating IS NULL THEN host_rating_category = 'no Reviews' 
            ELSE FALSE
          END
   
    columns:
    # Keys
    - name: host_id
      description: "PK: Unique identifier for an Airbnb host."
      tests:
        - unique
        - not_null

    # Dimensions
    - name: host_name
      description: "Name of the host."
      tests:
        - not_null
    - name: host_location
      description: "Host's primary geographic location."
      tests:
        - not_null
    - name: is_superhost
      description: "Boolean flag indicating if the host has achieved Superhost status."
      tests:
        - not_null
        - accepted_values: 
            values: [true, false]
    - name: host_rating_category
      description: "Binned performance catgeory based on avg_host_rating."
      tests:
        - not_null
        - accepted_values:
            values: ['Excellent', 'Good', 'Average', 'Below Average', 'No Reviews']
     
    # Dates & Metrics
    - name: host_since
      description: "Date the host joined the Airbnb platform."
      tests:
        - not_null
        - not_in_future
    - name: host_tenure_years
      description: "Total years active on platform (calculated)."
      tests:
        - not_null
        - dbt_utils.accepted_range:
            min_value: 0
            max_value: 30
            inclusive: true
    - name: response_rate
      description: "Percentage (0.0 to 1.0) of inquiries answered by the host."
      tests: 
        - dbt_utils.accepted_range:
            min_value: 0
            max_value: 1
            inclusive: true
    - name: avg_host_rating
      description: "Average star rating (0 to 5) across all host listings."
      tests:
        - dbt_utils.accepted_range:
            min_value: 0
            max_value: 5 
            inclusive: true

    # Metadata
    - name: created_at
      description: "Source system creation timestamp."
      tests:
        - not_null
        - not_in_future
    - name: updated_at 
      description: "Source system last-update timestamp."
      tests:
        - not_null
        - not_in_future
    - name: loaded_at
      description: "Timestamp when this record was processed into the Silver layer."
      tests: 
        - not_null
        - not_in_future 


  - name: silver_listings
    description: >
      Cleaned and categorized data for all property listings. 
      The grain of this model is one row per unique listing_id.
      This model enriches property attributes by:
      1. Standardizing property_type and city names for consistent BI filtering.
      2. Categorizing properties into 'Listing Size' buckets (Studio to Large) based on bedroom counts.
      3. Segmenting listings into price tiers (Budget, Mid-Range, Luxury) based on price_per_night.
      4. Calculating occupancy metrics like price_per_guest.
    columns:
      - name: listing_id
        description: Unique identifier for a listing.
        tests:
          - unique
          - not_null

      - name: host_id
        description: Identifier for the host associated with the listing.
        tests:
          - not_null
          - relationships:
              to: ref('silver_hosts')
              field: host_id

      - name: property_type
        description: Type of property (e.g., apartment, house, etc.).
        tests:
          - not_null
          - accepted_values:
              values: ['Apartment', 'House', 'Loft', 'Condo', 'Boutique Hotel']

      - name: city
        description: City where the listing is located.
        tests:
          - not_null

      - name: country
        description: Country where the listing is located.
        tests:
          - not_null

      - name: accommodates
        description: Number of guests the listing can accommodate.
        tests:
          - not_null
          - not_negative
          - dbt_utils.accepted_range:
              min_value: 1
              inclusive: true

      - name: bedrooms
        description: Number of bedrooms in the listing.
        tests:
          - not_null
          - not_negative

      - name: bathrooms
        description: Number of bathrooms in the listing.
        tests:
          - not_null
          - not_negative
          - dbt_utils.accepted_range:
              min_value: 0.5
              inclusive: true

      - name: price_per_night
        description: Price per night for the listing.
        tests:
          - not_null
          - not_negative
          - dbt_utils.accepted_range:
              name: price_per_night_positive
              min_value: 0
              max_value: 10000
              inclusive: true

      - name: created_at
        description: Timestamp when the record was first created.
        tests:
          - not_null
          - not_in_future

      - name: updated_at
        description: Timestamp when the record was last updated.
        tests:
          - not_null
          - not_in_future

      - name: listing_size_category
        description: >  
          Categorization of listings based on the number of bedrooms and bathrooms, 
          providing insights into the size and type of accommodation offered.
        tests:
          - not_null
          - accepted_values:
              name: listing_size_category_values
              values: ['Studio', '1 Bedroom', 'Medium (2-3 Bedrooms)', 'Large (4+ Bedrooms)']
      - name: capacity_type
        description: >
          Classification of listings based on their accommodation capacity, 
          helping to segment listings for different guest group sizes.
        tests:
          - not_null
          - accepted_values:
              name: capacity_type_values
              values: ['Solo/Pair', 'Small Group (3-5)', 'Large Group (6+)']

      - name: price_per_guest
        description: >
          Calculated metric representing the price per guest, derived from the price per night divided by the accommodates field.
          This provides insights into the cost efficiency of listings for different group sizes.
        tests:
          - not_null
          - not_negative
          - dbt_utils.accepted_range:
              name: price_per_guest_range
              min_value: 0
              max_value: 10000
              inclusive: true
      - name: price_tier
        description: >
          Classification of listings into price tiers based on the price per night, helping to 
          segment listings for analysis and recommendations.
        tests:
          - not_null
          - accepted_values:
              name: price_tier_values
              values: ['Budget', 'Mid-Range', 'Luxury']

      - name: loaded_at
        description: Timestamp when the record was loaded into the silver layer.
        tests:
          - not_null
          - not_in_future
