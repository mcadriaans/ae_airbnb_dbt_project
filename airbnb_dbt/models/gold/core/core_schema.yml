version: 2

models:
  - name: dim_hosts
    description: >
      Dimension table containing information about Airbnb hosts, including their unique host ID, 
      name, location, and other relevant attributes. This table serves as a reference for analyzing 
      host-related metrics and trends across the platform.
    columns:
      - name: host_key
        description: "Surrogate key for the host dimension."
        tests:
          - not_null
          - unique
      - name: host_id
        description: "Unique identifier for the host as provided by Airbnb."
        tests:
          - not_null
          - unique
      - name: host_name
        description: "Name of the host."
      - name: host_since
        description: "Date when the host joined Airbnb."
      - name: host_location
        description: "Location of the host (e.g., city, country)."
      - name: is_superhost
        description: "Indicates whether the host is a Superhost (true/false)."
      - name: response_rate
        description: "Host's response rate to booking inquiries (percentage)."
      - name: avg_host_rating
        description: "Average rating received by the host from guests."
      - name: host_rating_category
        description: >
          Categorical classification of the host's average rating (e.g., Excellent, Good, Fair, Poor).
          This helps in segmenting hosts based on their performance and guest satisfaction levels.
        tests:
          - not_null
          - accepted_values:
              values: ['Excellent', 'Good', 'Fair', 'Poor']
      - name: host_tenure_years
        description: "Number of years the host has been active on Airbnb."
        tests:
          - not_null
          - not_negative
      - name: total_listings
        description: "Total number of listings associated with the host."
        tests:
          - not_null
          - not_negative
      - name: host_portfolio_type
        description: >
          Classification of the host's listing portfolio.
          This provides insights into the scale of the host's operations on the platform.
        tests:
          - not_null
          - accepted_values:
              values: ['No Active Listings','Single-listing Host', 'Multi-listing Host (2-4 Listings)', 'Professional (5+ Listings)']
      - name: host_profile_created_at
        description: "Timestamp indicating when the host's profile was created."
      - name: data_last_refreshed_at 
        description: "Timestamp indicating when the host dimension data was last refreshed."
  
  - name: dim_listings
    description: >
      Dimension table containing detailed information about Airbnb listings, including their unique listing ID, 
      associated host, location, property type, and other relevant attributes. This table serves as a reference 
      for analyzing listing-related metrics and trends across the platform.
    columns:
      - name: listing_key
        description: "Surrogate key for the listing dimension."
        tests:
          - not_null
          - unique


  
  
          