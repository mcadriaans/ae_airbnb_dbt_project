#-- stg_airbnb__schema.yml:


version: 2

models:
  # ---------------------------------------------------------
  # 1. BOOKINGS STAGING
  # ---------------------------------------------------------
  - name: stg_airbnb__bookings
    description: >
      STAGING: Standardized booking data.
      Logic: Lowercase IDs/Status, Cast Types, and COALESCE null metrics
      This layer enforces 'Business Sanity' before data hits the Silver history tracking.
    config:
      materialized: view
    
    # CROSS-COLUMN tests
    tests:
      - dbt_utils.expression_is_true:
          name: booking_date_after_launch
          expression: "booking_date >= '{{ var('airbnb_launch_date') }}'"
      - dbt_utils.expression_is_true:
          name: stay_start_date_after_booking_date
          expression: "stay_start_date >= booking_date"
      - dbt_utils.expression_is_true:
          name: cancellation_fee_sanity
          expression: "cancellation_fee <= booking_amount"
      - dbt_utils.expression_is_true:
          name: stg_bookings_update_after_create
          expression: "source_updated_at >= source_created_at"
          config:
            severity: error
    
    columns:
      - name: booking_id
        description: >
          Business identifier for the  booking sourced from the bronze layer.
          Standardized  through trimming and casting to VARCHAR to ensure consistent
          joins across downstream models. This is the natural key for the booking.
        tests:
          - not_null:
              config:
                severity: error
      - name: listing_id
        description: >
          Business identifier for the property associated with the booking.
          Cast to integer and standardized for referential integrity checks
          against the staging listings model. This is the natural key for the property.
        tests:
          - relationships:
              to: ref('stg_airbnb__listings')
              field: listing_id
              description: "Ensures referential integrity between staging models."
              config:
                severity: warn
      - name: booking_status
        description: >
          Booking lifecycle status. Normalized to lowercase values  to provide
          consistent categorization for downstream analysis. Acceptable values are 'confirmed' and 'cancelled'.
        tests:
          - accepted_values:
              values: ['confirmed', 'cancelled']

      - name: booking_date
        description: >
          Date the booking was created. Standardized to DATE format and validated to occur
          no earlier than Airbnb's launch date and no later than the current date.
        tests:
          - not_in_future:
              config:
                severity: error
    

      - name: stay_start_date
        description: >
          Guest check-in date. Standardized to DATE format and validated to occur
          on or after the booking date.

      - name: nights_booked
        description: >
          Number of nights included in the reservation. Cast to integer and 
          validated against reasonable booking duration limits (1-730 nights). 
          This ensures data integrity for revenue and occupancy calculations.
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 730  
              inclusive: true
      
      - name: booking_amount
        description:  >
          Base booking value before additional fees. Cast to a fixed-precision monetary datatype
          to support consistent financial calculations.
          Validated to be non-negative and within a reasonable range for Airbnb bookings (1-100,000).
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 100000
              inclusive: true

      - name: cleaning_fee
        description: >
          Cleaning fee (if applicable) charged for booking and stored as monetary value.
          Null values are defaulted to zero to ensure consistent revenue calculations.
        tests:
          - not_negative
      
      - name: service_fee
        description: >
          Airbnb's service fee associated with the booking and stored as monetary value.
          Null values are defaulted to zero to ensure consistent revenue calculations.
        tests:
          - not_negative

      - name: cancellation_fee
        description: >
          Fee retained when a booking is canceled and stored as monetary value.
          Null values are defaulted to zero to ensure consistent revenue calculations.
        tests:
          - not_negative

      - name: source_created_at
        description: >
          Original record creation timestamp from the source system.
          Standardized to TIMESTAMP_LTZ and retained for auditability and lineage tracking.
          Validated to ensure no future timestamps are present, which would indicate data quality issues.
        tests:
          - not_in_future:
              config:
                severity: error
    
      - name: source_updated_at
        description: >
          Most recent source-system modification timestamp.
          Standardized to TIMESTAMP_LTZ and validated to occur on or after
          the original creation timestamp. This ensures accurate SCD2 history tracking.
          Validated to ensure no future timestamps are present, which would indicate data quality issues.
        tests:
          - not_in_future:
              config:
                severity: error

      
    # ---------------------------------------------------------
    # 2. HOSTS STAGING
    # ---------------------------------------------------------
  - name: stg_airbnb__hosts  
    description: "Standardized host profiles. Handles response rate normalization and superhost booleans."      

    # CROSS-COLUMN tests
    tests:
      - dbt_utils.expression_is_true:
          name: stg_hosts_since_after_launch 
          expression: "host_since >= '{{ var('airbnb_launch_date') }}'"
      - dbt_utils.expression_is_true:
          name: stg_hosts_update_after_create
          expression: "source_updated_at >= source_created_at"
    columns:
    - name: host_id
      description: "PK: Unique booking identifier (UUID format)."
      tests:
        - not_null:
            config:
              severity: error
    - name: host_since
      description: "Date the host joined the Airbnb platform."

    - name: is_superhost
      description: "Standardized boolean flag. NULLs from source are defaulted to false."
      tests:
        - accepted_values:
              values: [true, false] 

    - name: response_rate
      tests:
        - dbt_utils.accepted_range:
            min_value: 0
            max_value: 1
            inclusive: true

    - name: avg_host_rating
      tests:
        - dbt_utils.accepted_range:
            min_value: 0
            max_value: 5
            inclusive: true

    - name: source_created_at
      description: >
          Original record creation timestamp from the source system.
          Standardized to TIMESTAMP_LTZ and retained for auditability and lineage tracking.
          Validated to ensure no future timestamps are present, which would indicate data quality issues.
      tests:
          - not_in_future:
              config:
                severity: error
   
    - name: source_updated_at
      description: >
          When record was last updated in source system.
          Standardized to TIMESTAMP_LTZ and retained for auditability and lineage tracking.
          Validated to ensure no future timestamps are present, which would indicate data quality issues.
      tests:
        - not_in_future:
            config:
              severity: error

       
  # ---------------------------------------------------------
  # 3. LISTINGS STAGING
  # ---------------------------------------------------------
  - name: stg_airbnb__listings
    description: "Standardized property inventory. "

    # CROSS-COLUMN tests
    tests:
      - dbt_utils.expression_is_true:
          name: stg_listings_update_after_create
          expression: "source_updated_at >= source_created_at"
    columns: 
      - name: listing_id
        description: "PK: Unique booking identifier (UUID format)."
        tests:
          - not_null:
              config:
                severity: error

      - name: host_id
        tests:
          - relationships:
              to: ref('stg_airbnb__hosts')
              field: host_id
              config:
                severity: warn

      - name: accommodates
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 30
              inclusive: true

      - name: bedrooms
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 20
              inclusive: true

      - name: bathrooms
        tests:
          - dbt_utils.accepted_range:
              min_value: 0.5
              max_value: 10
              inclusive: true

      - name: price_per_night
        tests: 
           - dbt_utils.accepted_range:
                min_value: 1
                max_value: 50000

      - name: source_created_at
        description: >
          Original record creation timestamp from the source system.
          Standardized to TIMESTAMP_LTZ and retained for auditability and lineage tracking.
          Validated to ensure no future timestamps are present, which would indicate data quality issues.
        tests:
          - not_in_future:
              config:
                severity: error
      
      - name: source_updated_at
        description: >
          When record was last updated in source system.
          Standardized to TIMESTAMP_LTZ and retained for auditability and lineage tracking.
          Validated to ensure no future timestamps are present, which would indicate data quality issues.
        tests:
          - not_in_future:
              config:
                severity: error
     
